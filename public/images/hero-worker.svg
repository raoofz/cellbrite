<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" fill="none">
  <rect width="600" height="500" fill="#2a3040"/>
  <!-- Background shelves -->
  <rect x="50" y="80" width="500" height="8" rx="2" fill="#3a4050" opacity="0.5"/>
  <rect x="50" y="160" width="500" height="8" rx="2" fill="#3a4050" opacity="0.5"/>
  <rect x="50" y="240" width="500" height="8" rx="2" fill="#3a4050" opacity="0.3"/>
  <!-- Packages on shelves -->
  <rect x="80" y="50" width="40" height="30" rx="3" fill="#C9A96E" opacity="0.6"/>
  <rect x="140" y="40" width="35" height="40" rx="3" fill="#4A6FA5" opacity="0.5"/>
  <rect x="200" y="55" width="45" height="25" rx="3" fill="#8B6914" opacity="0.4"/>
  <rect x="80" y="130" width="50" height="30" rx="3" fill="#C9A96E" opacity="0.5"/>
  <rect x="160" y="125" width="35" height="35" rx="3" fill="#3a5050" opacity="0.5"/>
  <!-- Worker figure -->
  <circle cx="400" cy="180" r="45" fill="#F5D6B8"/>
  <!-- Hair -->
  <ellipse cx="400" cy="160" rx="42" ry="35" fill="#2C1810"/>
  <path d="M358 175 C358 175 360 200 400 200 C440 200 442 175 442 175" fill="#2C1810"/>
  <!-- Face -->
  <circle cx="400" cy="185" r="35" fill="#F5D6B8"/>
  <!-- Smile -->
  <path d="M385 195 C385 195 400 210 415 195" stroke="#333" stroke-width="2" fill="none"/>
  <!-- Eyes -->
  <circle cx="388" cy="180" r="3" fill="#333"/>
  <circle cx="412" cy="180" r="3" fill="#333"/>
  <!-- Body/uniform -->
  <path d="M355 220 L355 420 L445 420 L445 220 C445 220 430 210 400 210 C370 210 355 220 355 220Z" fill="#1a1f2e"/>
  <!-- Collar -->
  <path d="M380 218 L400 235 L420 218" stroke="#2a3040" stroke-width="2" fill="none"/>
  <!-- Arms -->
  <path d="M355 240 L310 320 L320 325 L365 260" fill="#1a1f2e"/>
  <path d="M445 240 L490 300 L480 305 L440 260" fill="#1a1f2e"/>
  <!-- Hands -->
  <circle cx="310" cy="322" r="12" fill="#F5D6B8"/>
  <circle cx="490" cy="302" r="12" fill="#F5D6B8"/>
  <!-- Norvia box -->
  <rect x="260" y="310" width="100" height="70" rx="5" fill="#C9A96E"/>
  <rect x="270" y="325" width="80" height="25" rx="3" fill="white" opacity="0.9"/>
  <text x="310" y="342" text-anchor="middle" font-size="12" fill="#1a1f2e" font-family="Arial" font-weight="bold">norvia</text>
  <!-- Counter -->
  <rect x="0" y="400" width="600" height="100" fill="#3a4050"/>
  <rect x="0" y="395" width="600" height="10" fill="#4a5060"/>
