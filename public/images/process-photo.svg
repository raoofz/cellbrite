<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" fill="none">
  <rect width="600" height="450" fill="#2a3040" rx="16"/>
  <!-- Warehouse scene -->
  <rect x="0" y="350" width="600" height="100" fill="#3a4050"/>
  <!-- Shelves -->
  <rect x="30" y="50" width="15" height="300" fill="#4a5060"/>
  <rect x="555" y="50" width="15" height="300" fill="#4a5060"/>
  <rect x="30" y="80" width="540" height="6" fill="#4a5060" opacity="0.7"/>
  <rect x="30" y="150" width="540" height="6" fill="#4a5060" opacity="0.7"/>
  <rect x="30" y="220" width="540" height="6" fill="#4a5060" opacity="0.7"/>
  <!-- Packages -->
  <rect x="60" y="55" width="50" height="25" rx="3" fill="#C9A96E" opacity="0.7"/>
  <rect x="130" y="50" width="40" height="30" rx="3" fill="#8B6914" opacity="0.6"/>
  <rect x="200" y="60" width="45" height="20" rx="3" fill="#C9A96E" opacity="0.5"/>
  <rect x="60" y="125" width="55" height="25" rx="3" fill="#4A6FA5" opacity="0.5"/>
  <rect x="140" y="120" width="40" height="30" rx="3" fill="#C9A96E" opacity="0.6"/>
  <!-- Workers -->
  <circle cx="300" cy="250" r="30" fill="#F5D6B8"/>
  <rect x="270" y="280" width="60" height="100" rx="5" fill="#1a1f2e"/>
  <circle cx="450" cy="260" r="25" fill="#F5D6B8"/>
  <rect x="425" y="285" width="50" height="90" rx="5" fill="#1a1f2e"/>
  <!-- Boxes being packed -->
  <rect x="250" y="330" width="80" height="50" rx="4" fill="#C9A96E"/>
  <text x="290" y="360" text-anchor="middle" font-size="10" fill="white" font-family="Arial" font-weight="bold">norvia</text>
  <rect x="350" y="340" width="60" height="40" rx="3" fill="#D4B87A"/>
  <!-- Table -->
  <rect x="220" y="380" width="250" height="8" fill="#5a6070"/>
  <rect x="230" y="388" width="8" height="62" fill="#4a5060"/>
  <rect x="454" y="388" width="8" height="62" fill="#4a5060"/>
</svg>
